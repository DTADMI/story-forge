name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web:
    name: Web - test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
          run_install: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install

      - name: Prisma generate (web)
        run: pnpm exec prisma generate

      - name: Web tests
        run: pnpm -C web test:run

      - name: Web lint
        run: pnpm -C web exec eslint .

      - name: Web typecheck (build --no-lint)
        env:
          NEXTAUTH_SECRET: testsecret
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storyforge
          API_URL: http://localhost:3001
          API_JWT_SECRET: testsecret
        run: pnpm -C web build

  api:
    name: API - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
          run_install: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install

      - name: Prisma generate (api)
        run: pnpm exec prisma generate

      - name: API migrate deploy (optional/preview)
        # Only run if DATABASE_URL is present and not on PR from fork for safety
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/storyforge' }}
        run: pnpm exec prisma migrate deploy

      - name: API tests
        run: pnpm -C api test:ci

      - name: API build
        run: pnpm -C api build
